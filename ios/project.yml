name: iPhoneUSBInternet
options:
  deploymentTarget:
    iOS: '16.0'
packages:
  USBRelayCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '2.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  iPhoneUSBInternet:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zuyis.iphoneusbinternet
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: USBRelayCore
        product: USBRelayCore
schemes:
  iPhoneUSBInternet:
    build:
      targets:
        iPhoneUSBInternet: all
    run:
      config: Debug
